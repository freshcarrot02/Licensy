[project]
name = "licensy"
version = "0.1.0"
description = "Licensy Discord bot - easily manage expiration of roles with subscriptions!"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "discord.py>=2.7.1,<3.0.0",
    "aiohttp>=3.10.0",
    "aiosqlite>=0.20.0",
    "psutil>=6.0.0",
    "python-dateutil>=2.9.0",
    "texttable>=1.7.0",
    "timeago>=1.0.16",
]

[project.urls]
Homepage = "https://github.com/freshcarrot02/Licensy"
Repository = "https://github.com/freshcarrot02/Licensy"
Issues = "https://github.com/freshcarrot02/Licensy/issues"
